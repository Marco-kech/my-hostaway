<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paiement — DPM Conciergerie</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',Arial,sans-serif;background:#FBFAF6;color:#222;min-height:100vh}
.hdr{background:#14352A;color:#fff;padding:24px;text-align:center}
.hdr h1{color:#C9A227;font-family:'Cormorant Garamond',serif;font-size:28px}
.card{max-width:480px;margin:24px auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.row .l{color:#888}.row .v{font-weight:600}
.total{font-size:22px;font-weight:700;color:#14352A;text-align:center;margin:20px 0}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
.paypal{background:#FFC439;color:#111}.paypal:hover{opacity:.9}
.virement{background:#14352A;color:#fff}.virement:hover{opacity:.9}
.info{background:#14352A11;padding:14px;border-radius:8px;margin-top:16px;font-size:12px;color:#14352A;line-height:1.5}
.ok{text-align:center;padding:40px;font-size:18px;color:#14352A}
.err{color:#e74c3c;font-size:13px;margin-top:8px;text-align:center}
.muted{color:#888;font-size:12px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="hdr"><h1>DPM Conciergerie</h1></div>
<div class="card" id="main">
  <div style="text-align:center;margin-bottom:16px"><span class="muted">Chargement de la réservation…</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://eztwwzzjzwmhfzmcafyu.supabase.co","sb_publishable_v8lL0wuTAC7uHpuNuzE8WQ_O8vIOgg4");
const resaId=location.hash.replace('#','').replace('pay=','');

function money(v){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'MAD',maximumFractionDigits:0}).format(v||0);}
function fdate(d){return d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'—';}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

(async()=>{
  if(!resaId){document.getElementById('main').innerHTML='<div class="err">Lien de paiement invalide.</div>';return;}
  const {data:r}=await sb.from('reservation').select('*').eq('id',resaId).single();
  if(!r){document.getElementById('main').innerHTML='<div class="err">Réservation introuvable.</div>';return;}
  const [{data:b},{data:v},{data:cfg}]=await Promise.all([
    sb.from('bien').select('nom,adresse').eq('id',r.bien_id).single(),
    sb.from('voyageur').select('nom,email').eq('id',r.voyageur_id).single(),
    sb.from('reglages').select('valeur').eq('tenant_id',r.tenant_id).eq('cle','paypal').single()
  ]);
  const bien=b||{};const voy=v||{};
  const paypal=(cfg&&cfg.valeur)?JSON.parse(cfg.valeur):{};
  const reste=Math.max(0,(r.prix_total||0)-(r.montant_paye||0));
  const nuits=Math.max(1,Math.round((new Date(r.depart)-new Date(r.arrivee))/864e5));

  if(reste<=0){
    document.getElementById('main').innerHTML='<div class="ok">✅ Cette réservation est entièrement payée.<br><span class="muted">Merci !</span></div>';
    return;
  }

  document.getElementById('main').innerHTML=`
    <h2 style="font-size:18px;margin-bottom:16px;text-align:center">Paiement de votre séjour</h2>
    <div class="row"><span class="l">Voyageur</span><span class="v">${esc(voy.nom||'—')}</span></div>
    <div class="row"><span class="l">Bien</span><span class="v">${esc(bien.nom||'—')}</span></div>
    <div class="row"><span class="l">Séjour</span><span class="v">${fdate(r.arrivee)} → ${fdate(r.depart)}</span></div>
    <div class="row"><span class="l">Durée</span><span class="v">${nuits} nuit(s)</span></div>
    <div class="row"><span class="l">Total</span><span class="v">${money(r.prix_total)}</span></div>
    <div class="row"><span class="l">Déjà payé</span><span class="v">${money(r.montant_paye||0)}</span></div>
    <div class="total">Reste à payer : ${money(reste)}</div>
    ${paypal.email?`<a class="btn paypal" href="https://www.paypal.com/paypalme/${esc(paypal.email)}/${reste}" target="_blank">💳 Payer ${money(reste)} via PayPal</a>`:''}
    <div class="info">
      <b>Paiement par virement :</b><br>
      Envoyez le montant de ${money(reste)} en indiquant la référence :<br>
      <code style="background:#14352A22;padding:2px 8px;border-radius:4px">${esc(resaId.slice(0,8).toUpperCase())}</code><br><br>
      Un reçu vous sera envoyé par e-mail après confirmation.
    </div>
  `;
})();
</script>
</body>
</html>
